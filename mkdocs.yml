site_name: Neo
site_description: Um assistente pessoal via linha de comando para organizar a vida de um dev — Compreenda seus sistemas. Seja dono das suas escolhas.
site_author: Thalyson
site_url: https://thalisonwilker.github.io/neo/
repo_url: https://github.com/thalisonwilker/neo
repo_name: neo

theme:
  name: material
  language: pt
  logo: assets/neo-logo.jpg
  favicon: assets/neo-logo.jpg
  palette:
    # Esquema Claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Tema Escuro
    # Esquema Escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Tema Claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - redirects:
      redirect_maps:
        cli/config.md: cli/git/config.md
        cli/auth.md: cli/git/auth.md
        cli/status.md: cli/git/status.md
        cli/workspace.md: cli/git/workspace.md
        cli/repo.md: cli/git/repo/index.md
        cli/git/repo.md: cli/git/repo/index.md
        cli/git/branch.md: cli/git/branch/index.md
        cli/git/commits.md: cli/git/commits/index.md
        cli/git/pr.md: cli/git/pr/index.md
        cli/commits.md: cli/git/commits/index.md
        cli/tasks.md: cli/tasks/index.md
        cli/agent.md: cli/agent/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  **/_templates/**
  **/*.template.md
  STATE.md
  lessons.md
  README.md
  architecture/**
  engineering/**
  product/**

nav:
  - Home: index.md
  - Começando: getting-started.md
  - Configuração:
      - Visão geral: config/index.md
      - Git:
          - Básico: config/git/basic.md
      - Agents:
          - code-agent: config/agents/code-agent.md
      - Tasks: config/tasks/index.md

  - Referência da CLI:
      - Visão geral: cli/index.md
      - cli: cli/comandos.md
      - config:
          - cli/config/index.md
          - agent — preferências: cli/agent/config.md
      - git:
          - cli/git/index.md
          - status: cli/git/status.md
          - config:
              - cli/git/config.md
              - Credenciais (api-key): cli/git/auth.md
              - Workspace: cli/git/workspace.md
          - repo:
              - cli/git/repo/index.md
              - list: cli/git/repo/list.md
              - select: cli/git/repo/select.md
              - remote-list: cli/git/repo/remote-list.md
              - local-list: cli/git/repo/local-list.md
              - search: cli/git/repo/search.md
              - show: cli/git/repo/show.md
              - create: cli/git/repo/create.md
              - edit: cli/git/repo/edit.md
          - branch:
              - cli/git/branch/index.md
              - list: cli/git/branch/list.md
              - create: cli/git/branch/create.md
              - select: cli/git/branch/select.md
              - delete: cli/git/branch/delete.md
          - commits:
              - cli/git/commits/index.md
              - list: cli/git/commits/list.md
              - search: cli/git/commits/search.md
              - show: cli/git/commits/show.md
          - pr:
              - cli/git/pr/index.md
              - list: cli/git/pr/list.md
              - open: cli/git/pr/open.md
              - approve: cli/git/pr/approve.md
              - decline: cli/git/pr/decline.md
              - search: cli/git/pr/search.md
          - Recursos Planejados (🚧): cli/git/planejado.md
      - tasks:
          - cli/tasks/index.md
          - create: cli/tasks/create.md
          - list: cli/tasks/list.md
          - search: cli/tasks/search.md
          - show: cli/tasks/show.md
          - analyze: cli/tasks/analyze.md
          - resume: cli/tasks/resume.md
          - iterations: cli/tasks/iterations.md
          - whoami: cli/tasks/whoami.md
          - check: cli/tasks/check.md
          - comment: cli/tasks/comment.md
          - config: cli/tasks/config.md
      - agent:
          - cli/agent/index.md
          - status: cli/agent/status.md
          - setup: cli/agent/setup.md
          - run: cli/agent/run.md
      - fin:
          - cli/fin/index.md
          - bank: cli/fin/bank.md
          - category: cli/fin/category.md
          - tx / expense / income: cli/fin/tx.md
          - balance / summary: cli/fin/summary.md
  - Guias Práticos:
      - guias/index.md
      - Gestão Financeira Pessoal: guias/gestao-financeira.md
      - Uso em CI com --json: guias/ci-json.md
      - Trocar de Provedor (GitHub ↔ Bitbucket): guias/trocar-provedor.md
      - Fluxo Diário (Tasks → Branch → Commit): guias/fluxo-diario.md
  - Engenharia & SDD:
      - Visão Geral: architecture.md
      - Glossário: glossary.md
      - Migração: migration.md
