site_name: Neo
site_description: Um assistente pessoal via linha de comando para organizar a vida de um dev — Compreenda seus sistemas. Seja dono das suas escolhas.
site_author: Thalyson
site_url: https://thalisonwilker.github.io/neo/
repo_url: https://github.com/thalisonwilker/neo
repo_name: neo

theme:
  name: material
  language: pt
  logo: assets/neo-logo.jpg
  favicon: assets/neo-logo.jpg
  palette:
    # Esquema Claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    # Esquema Escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - redirects:
      redirect_maps:
        cli/config.md: cli/git/config.md
        cli/auth.md: cli/git/auth.md
        cli/status.md: cli/git/status.md
        cli/workspace.md: cli/git/workspace.md
        cli/repo.md: cli/git/repo.md
        cli/commits.md: cli/git/commits.md
        cli/tasks.md: cli/tasks/index.md
        cli/agent.md: cli/agent/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  **/_templates/**
  **/*.template.md
  STATE.md
  lessons.md
  README.md
  architecture/**
  engineering/**
  product/**

nav:
  - Início: index.md
  - Primeiros Passos: getting-started.md
  - Configuração: configuration.md
  - Referência da CLI:
      - Conceitos Gerais: cli/index.md
      - Git:
          - cli/git/index.md
          - Contexto e Acesso:
              - Configurar Token / Autenticação: cli/git/auth.md
              - Configurações Gerais: cli/git/config.md
              - Diagnóstico de Contexto: cli/git/status.md
              - Configurar Workspaces: cli/git/workspace.md
          - Recursos:
              - Repositórios: cli/git/repo.md
              - Commits: cli/git/commits.md
          - Recursos Planejados (🚧): cli/git/planejado.md
      - Tasks:
          - cli/tasks/index.md
          - Visão do Dia:
              - Quadro Kanban: cli/tasks/resume.md
              - Membro Autenticado: cli/tasks/whoami.md
              - Sprints e Iterações: cli/tasks/iterations.md
          - Consulta de Demandas:
              - Listar Stories: cli/tasks/list.md
              - Pesquisar Stories: cli/tasks/search.md
              - Detalhes da Story: cli/tasks/show.md
          - Análise de Contexto: cli/tasks/analyze.md
          - Configuração do Shortcut: cli/tasks/config.md
      - Agente & SDD:
          - cli/agent/index.md
          - Configurações do Agente: cli/agent/config.md
          - Diagnóstico e Status: cli/agent/status.md
          - Preparação SDD: cli/agent/setup.md
          - Execução Interativa: cli/agent/run.md
  - Guias Práticos:
      - guias/index.md
      - Uso em CI com --json: guias/ci-json.md
      - Trocar de Provedor (GitHub ↔ Bitbucket): guias/trocar-provedor.md
      - Fluxo Diário (Tasks → Branch → Commit): guias/fluxo-diario.md
  - Engenharia & SDD:
      - Visão Geral: architecture.md
      - Glossário: glossary.md
      - Migração: migration.md
