[project]
name = "neo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thalyson", email = "thalison.wilker@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.7",
    "pymdown-extensions>=10.14.3",
]

[project.scripts]
neo = "neo.cli:app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

