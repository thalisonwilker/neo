[project]
name = "neo-cmd"
version = "0.1.0"
description = "Personal Command Assistant — Compreenda seus sistemas. Seja dono das suas escolhas."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Thalyson", email = "thalison.wilker@gmail.com" }
]
requires-python = ">=3.13"
keywords = [
    "cli",
    "assistant",
    "github",
    "bitbucket",
    "shortcut",
    "kanban",
    "productivity",
    "typer",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://github.com/thalisonwilker/neo"
Documentation = "https://thalisonwilker.github.io/neo/"
Repository = "https://github.com/thalisonwilker/neo"
Issues = "https://github.com/thalisonwilker/neo/issues"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "neo"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.2",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.7",
    "pymdown-extensions>=10.14.3",
]

[project.scripts]
neo = "neo.cli:app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
data_file = ".pytest_cache/.coverage"

